# Analyse quotidienne de MyBourse.
# Chaque soir de semaine à 22 h 30 UTC (23 h 30 à Paris en hiver, 0 h 30 en été), après la clôture
# de Paris et de New York : télécharge les cours, calcule les scores, publie selection.json et
# journal.json dans la branche « data » (que l'appli lit).
# Se lance aussi à la main : onglet Actions > Analyse quotidienne > Run workflow.
name: Analyse quotidienne

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Bibliothèques Python
        run: pip install -r pipeline/requirements.txt

      - name: Tests automatiques
        working-directory: pipeline
        run: python -m pytest -q

      - name: Récupérer la publication précédente (branche data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" data > /dev/null; then
            git clone --depth 1 --branch data "$URL" publication
          else
            mkdir publication
          fi

      - name: Analyse
        working-directory: pipeline
        run: python run.py ../publication

      - name: Publication dans la branche data
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: publication
        run: |
          # Un seul commit, remplacé chaque soir : la branche ne grossit pas.
          rm -rf .git
          git init -q -b data
          git add selection.json journal.json
          git -c user.name="MyBourse" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Analyse du $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
